<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="/style.css">
    
    <title>Login - Between Us ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #ffd6e5, #fff3f7);
            color: #76233f;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 12px 35px rgba(164, 38, 83, 0.2);
            text-align: center;
        }

        .heart {
            font-size: 60px;
        }

        h1 {
            color: #c72f65;
            margin: 10px 0;
        }

        p {
            color: #99516b;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #f1a7bd;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #d93670;
            box-shadow: 0 0 5px rgba(217, 54, 112, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 25px;
            background: #d93670;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #b92358;
        }

        .message {
            min-height: 25px;
            margin-top: 15px;
            font-weight: bold;
        }

        .register-link {
            display: inline-block;
            margin-top: 20px;
            color: #d93670;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">
    <div class="heart">💖</div>

    <h1>Welcome Back</h1>

    <p>Enter our little world</p>

    <form onsubmit="login(event)">
        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login ❤️
        </button>
    </form>

    <div class="message" id="message"></div>

    <a class="register-link" href="/index.html">
        Back to Home 🏡
    </a>
</div>

<script>
    async function login(event) {
        event.preventDefault();

        const username =
            document.getElementById("username").value.trim();

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");

        message.textContent = "Logging in...";

        try {
            const response = await fetch(
                "/api/auth/login",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "include",
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                }
            );

            const result = await response.text();

            if (response.ok) {
                message.style.color = "green";
                message.textContent = "Login successful ❤️";

                setTimeout(() => {
                    window.location.href = "/index.html";
                }, 500);
            } else {
                message.style.color = "crimson";
                message.textContent = result || "Invalid login details";
            }

        } catch (error) {
            console.error(error);

            message.style.color = "crimson";
            message.textContent =
                "Cannot connect to server. Please try again.";
        }
    }
</script>

</body>
</html>
