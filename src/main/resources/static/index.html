<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Between Us ❤️</title>

    <!-- Common styling for all pages -->
    <link rel="stylesheet" href="/style.css">

    <!-- Landing page-only styling -->
    <style>
        .landing-hero {
            min-height: 75vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            padding: 30px 20px;
        }

        .heart {
            font-size: 80px;
            animation: pulse 1.5s infinite;
        }

        .landing-title {
            margin: 10px 0;

            color: #c72f65;

            font-size: clamp(38px, 8vw, 70px);
            line-height: 1.2;
            letter-spacing: 2px;
        }

        .landing-subtitle {
            max-width: 650px;

            color: #7b2345;

            font-size: 20px;
            line-height: 1.6;
        }

        .enter-button {
            margin-top: 25px;

            padding: 16px 32px;

            border: none;
            border-radius: 35px;

            background: #d93670;
            color: white;

            font-family: "Segoe UI", sans-serif;
            font-size: 18px;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(217, 54, 112, 0.3);

            transition: 0.2s ease;
        }

        .enter-button:hover {
            background: #b92358;
            transform: scale(1.04);
        }

        .welcome {
            margin-top: 25px;
            font-size: 18px;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        @media (max-width: 600px) {
            .heart {
                font-size: 65px;
            }

            .landing-subtitle {
                font-size: 17px;
            }

            .enter-button {
                padding: 14px 25px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- Common navigation -->
  <nav class="main-nav">

    <div class="nav-top">

        <a class="nav-logo" href="/index.html">
            BETWEEN US ❤️
        </a>

        <button
            class="menu-toggle"
            onclick="toggleMenu()"
            aria-label="Open navigation menu"
        >
            ☰
        </button>

    </div>

    <div class="nav-links" id="navLinks">

        <a href="/index.html">
            Home 🏡
        </a>

        <a href="/chat.html">
            Our Chat 💬
        </a>

        <a href="/media.html">
            Our Media 🎞️
        </a>

        <a href="/memories.html">
            Memories 📸
        </a>

        <a href="/love-letter.html">
            Love Letter 💌
        </a>

        <button onclick="logout()">
            Logout 🚪
        </button>

    </div>

</nav>

    <!-- Landing page -->
    <section class="landing-hero">

        <div class="heart">
            ❤️
        </div>

        <h1 class="landing-title">
            BETWEEN US
        </h1>

        <p class="landing-subtitle">
            A little world made only for us two.
            Every message, every memory, every heartbeat —
            all in one place.
        </p>

        <button
            class="enter-button"
            onclick="enterOurWorld()"
        >
            Enter to Our World 💖
        </button>

        <p
            class="welcome"
            id="welcomeText"
        ></p>

    </section>

    <script>

        async function enterOurWorld() {

            try {

                const response = await fetch(
                    "/api/auth/current-user",
                    {
                        method: "GET",
                        credentials: "include"
                    }
                );

                if (response.ok) {
                    window.location.href = "/chat.html";
                } else {
                    window.location.href = "/login.html";
                }

            } catch (error) {

                console.error(
                    "Login check failed:",
                    error
                );

                window.location.href = "/login.html";
            }
        }


        async function logout() {

            try {

                await fetch(
                    "/api/auth/logout",
                    {
                        method: "POST",
                        credentials: "include"
                    }
                );

            } catch (error) {

                console.error(
                    "Logout error:",
                    error
                );

            } finally {

                window.location.href = "/login.html";
            }
        }
 function toggleMenu() {
    const navLinks = document.getElementById("navLinks");

    if (navLinks) {
        navLinks.classList.toggle("open");
    }
}

        async function loadUser() {

            try {

                const response = await fetch(
                    "/api/auth/current-user",
                    {
                        method: "GET",
                        credentials: "include"
                    }
                );

                if (response.ok) {

                    const username =
                        await response.text();

                    document.getElementById(
                        "welcomeText"
                    ).textContent =
                        "Welcome back, " +
                        username +
                        " ❤️";
                }

            } catch (error) {

                console.log(
                    "User is not logged in"
                );
            }
        }


        loadUser();

    </script>

</body>

</html>
