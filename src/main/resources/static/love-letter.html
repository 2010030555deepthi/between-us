<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">

    <title>Love Letter 💌</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Georgia", serif;
            color: #76233f;
            background: linear-gradient(135deg, #ffe0eb, #fff7fa);
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.9);
            font-family: "Segoe UI", sans-serif;
        }

        nav a,
        nav button {
            border: none;
            border-radius: 22px;
            padding: 10px 15px;
            background: #ff6f9f;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: 35px auto;
            padding: 20px;
        }

        .letter {
            padding: 45px;
            border-radius: 8px;
            background: #fffdf8;
            box-shadow: 0 10px 30px rgba(130, 45, 75, 0.18);
            border: 1px solid #f4cad8;
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #c72f65;
            font-size: 42px;
        }

        .date {
            text-align: right;
            color: #a85b78;
            font-size: 14px;
        }

        .dear {
            font-size: 22px;
            margin-top: 35px;
        }

        .letter-text {
            white-space: pre-wrap;
            line-height: 2;
            font-size: 18px;
            min-height: 250px;
        }

        .signature {
            margin-top: 35px;
            text-align: right;
            font-size: 22px;
            color: #c72f65;
        }

        .edit-area {
            margin-top: 25px;
            text-align: center;
        }

        textarea {
            width: 100%;
            min-height: 250px;
            padding: 15px;
            border: 1px solid #efb0c5;
            border-radius: 12px;
            font-family: Georgia, serif;
            font-size: 17px;
            line-height: 1.8;
            resize: vertical;
        }

        button {
            margin-top: 12px;
            padding: 13px 22px;
            border: none;
            border-radius: 25px;
            background: #d93670;
            color: white;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .letter {
                padding: 25px;
            }

            h1 {
                font-size: 32px;
            }

            .letter-text {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

 <nav class="main-nav">

    <div class="nav-top">

        <a class="nav-logo" href="/index.html">
            BETWEEN US ❤️
        </a>

        <button
            class="menu-toggle"
            onclick="toggleMenu()"
            aria-label="Open navigation menu"
        >
            ☰
        </button>

    </div>

    <div class="nav-links" id="navLinks">

        <a href="/index.html">
            Home 🏡
        </a>

        <a href="/chat.html">
            Our Chat 💬
        </a>

        <a href="/media.html">
            Our Media 🎞️
        </a>

        <a href="/memories.html">
            Memories 📸
        </a>

        <a href="/love-letter.html">
            Love Letter 💌
        </a>

        <button onclick="logout()">
            Logout 🚪
        </button>

    </div>

</nav>

<div class="container">

    <div class="letter">

        <h1>A Letter For You 💌</h1>

        <div class="date">
            August 15, 2026 ❤️
        </div>

        <div class="dear">
            My Sweetheart PiyushWAAAAA🩷😻,
        </div>

        <div class="letter-text" id="letterText"></div>

        <div class="signature">
            Forever yours,<br>
            Deepthi ❤️😻🩷
        </div>

        <div class="edit-area">
            <textarea
                id="letterInput"
                placeholder="Write your love letter here..."
            ></textarea>

            <br>

            <button onclick="saveLetter()">
                Save Love Letter 💖
            </button>
        </div>

    </div>

</div>

<script>
    const defaultLetter =
`I don't know how to perfectly explain what you mean to me.

But I know that you have become a very special part of my life.

Even when distance keeps us apart, you still find a way to make me smile.

I hope we keep choosing each other through every difficult day,
every misunderstanding, every busy moment, and every beautiful moment.

I want us to create many more memories together.

This little website is just a small piece of my love for you.

No matter how far we are,
you will always have a special place in my heart.

I love you infinite and beyond 🩷😻❤️`;

    function loadLetter() {
        const saved =
            localStorage.getItem("betweenUsLoveLetter");

        const letter =
            saved || defaultLetter;

        document.getElementById("letterText")
            .textContent = letter;

        document.getElementById("letterInput")
            .value = letter;
    }

    function saveLetter() {
        const text =
            document.getElementById("letterInput")
                .value.trim();

        if (!text) {
            alert("Please write something first.");
            return;
        }

        localStorage.setItem(
            "betweenUsLoveLetter",
            text
        );

        document.getElementById("letterText")
            .textContent = text;

        alert("Your love letter was saved ❤️");
    }

    async function checkLogin() {
        try {
            const response = await fetch(
                "/api/auth/current-user",
                {
                    method: "GET",
                    credentials: "include"
                }
            );

            if (!response.ok) {
                window.location.href = "/login.html";
                return;
            }

            loadLetter();

        } catch (error) {
            window.location.href = "/login.html";
        }
    }

    function toggleMenu() {
    const navLinks = document.getElementById("navLinks");

    if (navLinks) {
        navLinks.classList.toggle("open");
    }
}
    async function logout() {
        try {
            await fetch(
                "/api/auth/logout",
                {
                    method: "POST",
                    credentials: "include"
                }
            );
        } finally {
            window.location.href = "/login.html";
        }
    }

    checkLogin();
</script>

</body>
</html>
