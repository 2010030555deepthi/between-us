<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">

    <title>Our Media Gallery 💗</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: "Georgia", serif;
        color: #76233f;
        background: linear-gradient(135deg, #ffe0eb, #fff7fa);
    }

    nav {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        padding: 15px;
        background: rgba(255, 255, 255, 0.9);
        font-family: "Segoe UI", sans-serif;
    }

    nav a,
    nav button {
        border: none;
        border-radius: 22px;
        padding: 10px 15px;
        background: #ff6f9f;
        color: white;
        text-decoration: none;
        cursor: pointer;
        font-size: 14px;
        transition: 0.2s;
    }

    nav a:hover,
    nav button:hover {
        background: #e65387;
        transform: translateY(-2px);
    }

    .container {
        width: 100%;
        max-width: 1000px;
        margin: 35px auto;
        padding: 20px;
    }

    .hero {
        padding: 35px;
        border-radius: 8px;
        background: #fffdf8;
        box-shadow: 0 10px 30px rgba(130, 45, 75, 0.18);
        border: 1px solid #f4cad8;
    }

    h1 {
        margin-top: 0;
        text-align: center;
        color: #c72f65;
        font-size: 42px;
    }

    .subtitle {
        text-align: center;
        color: #a85b78;
        font-size: 17px;
        line-height: 1.8;
    }

    .upload-box {
        margin-top: 30px;
        padding: 25px;
        border: 1px dashed #efb0c5;
        border-radius: 12px;
        background: #fff7fa;
        text-align: center;
    }

    .upload-box h3 {
        color: #c72f65;
        margin-top: 0;
    }

    input[type="file"] {
        width: 100%;
        max-width: 450px;
        padding: 12px;
        border: 1px solid #efb0c5;
        border-radius: 12px;
        background: white;
        font-family: "Segoe UI", sans-serif;
    }

    button {
        margin-top: 12px;
        padding: 13px 22px;
        border: none;
        border-radius: 25px;
        background: #d93670;
        color: white;
        cursor: pointer;
        font-family: "Segoe UI", sans-serif;
    }

    button:hover {
        background: #bd285d;
    }

    button:disabled {
        background: #c7a0b4;
        cursor: not-allowed;
    }

    .voice-recorder {
        margin-top: 25px;
        padding: 20px;
        border-radius: 12px;
        background: #ffeaf2;
        border: 1px solid #efb0c5;
    }

    .voice-recorder h3 {
        color: #c72f65;
    }

    #recordingStatus {
        color: #a85b78;
        font-weight: bold;
        line-height: 1.6;
    }

    #recordingPreview {
        width: 100%;
        margin: 15px 0;
    }

    .tabs {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        margin: 30px 0;
    }

    .tab {
        margin-top: 0;
        padding: 10px 18px;
        background: #fff0f5;
        color: #a52262;
        border: 1px solid #efb0c5;
    }

    .tab.active {
        background: #d93670;
        color: white;
    }

    .status {
        text-align: center;
        margin: 15px 0;
        color: #a85b78;
        font-weight: bold;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(
            auto-fit,
            minmax(240px, 1fr)
        );
        gap: 20px;
    }

    .media-card {
        background: #fffdf8;
        border: 1px solid #f4cad8;
        border-radius: 8px;
        padding: 15px;
        box-shadow: 0 7px 20px rgba(130, 45, 75, 0.12);
        overflow: hidden;
    }

    .media-card img,
    .media-card video,
    .media-card audio {
        width: 100%;
        display: block;
        border-radius: 8px;
    }

    .media-card video {
        max-height: 300px;
        background: #351326;
    }

    .file-name {
        margin: 14px 0 6px;
        color: #76233f;
        font-weight: bold;
        overflow-wrap: anywhere;
    }

    .file-info {
        margin-bottom: 12px;
        color: #a85b78;
        font-family: "Segoe UI", sans-serif;
        font-size: 12px;
    }

    .card-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .card-actions button {
        flex: 1;
        min-width: 90px;
        margin-top: 0;
        padding: 9px;
        font-size: 12px;
    }

    .card-actions button.saved {
        background: #9b59b6;
    }

    .card-actions button.delete {
        background: #b42354;
    }

    .empty {
        grid-column: 1 / -1;
        padding: 35px;
        border: 1px solid #f4cad8;
        border-radius: 8px;
        background: #fffdf8;
        text-align: center;
        color: #a85b78;
    }

    @media (max-width: 600px) {
        .container {
            padding: 12px;
        }

        .hero {
            padding: 25px 18px;
        }

        h1 {
            font-size: 32px;
        }

        .subtitle {
            font-size: 15px;
        }

        .gallery {
            grid-template-columns: 1fr;
        }

        nav a,
        nav button {
            font-size: 12px;
            padding: 9px 12px;
        }
    }
</style>
</head>

<body>

  <nav class="main-nav">

    <div class="nav-top">

        <a class="nav-logo" href="/index.html">
            BETWEEN US ❤️
        </a>

        <button
            class="menu-toggle"
            onclick="toggleMenu()"
            aria-label="Open navigation menu"
        >
            ☰
        </button>

    </div>

    <div class="nav-links" id="navLinks">

        <a href="/index.html">
            Home 🏡
        </a>

        <a href="/chat.html">
            Our Chat 💬
        </a>

        <a href="/media.html">
            Our Media 🎞️
        </a>

        <a href="/memories.html">
            Memories 📸
        </a>

        <a href="/love-letter.html">
            Love Letter 💌
        </a>

        <button onclick="logout()">
            Logout 🚪
        </button>

    </div>

</nav>

    <main class="container">

        <section class="hero">
            <h1>Our Media Gallery 💗</h1>

            <p class="subtitle">
                Every picture, video and voice note of us in one place 🥹
            </p>

            <div class="upload-box">

                <h3>Upload something special 💕</h3>

                <input
                    type="file"
                    id="fileInput"
                    accept="image/*,video/*,audio/*"
                >

                <br>

                <button
                    class="upload-btn"
                    id="uploadButton"
                    onclick="uploadFile()"
                >
                    Upload Media 💖
                </button>

                <div class="voice-recorder">

    <h3>Or record a voice note 🎙️</h3>

    <button
        class="upload-btn"
        id="startRecordingButton"
        onclick="startRecording()"
    >
        Start Recording 🎙️
    </button>

    <button
        class="upload-btn"
        id="stopRecordingButton"
        onclick="stopRecording()"
        disabled
    >
        Stop Recording ⏹️
    </button>

    <p id="recordingStatus"></p>

    <audio
        id="recordingPreview"
        controls
        style="display: none;"
    ></audio>

    <br>

    <button
        class="upload-btn"
        id="uploadRecordingButton"
        onclick="uploadRecording()"
        disabled
    >
        Upload Voice Note 💗
    </button>

</div>

            </div>
        </section>

        <div class="tabs">
            <button class="tab active" onclick="changeTab('all', this)">
                All
            </button>

            <button class="tab" onclick="changeTab('image', this)">
                Pictures 📸
            </button>

            <button class="tab" onclick="changeTab('video', this)">
                Videos 🎥
            </button>

            <button class="tab" onclick="changeTab('audio', this)">
                Voice Notes 🎙️
            </button>

            <button class="tab" onclick="changeTab('saved', this)">
                Saved 💾
            </button>
        </div>

        <div class="status" id="status"></div>

        <section class="gallery" id="gallery"></section>

    </main>

    

    <script>
        let allMedia = [];
        let currentTab = "all";
        let mediaRecorder = null;
let recordedChunks = [];
let recordedAudioBlob = null;
let recordingStream = null;

        async function checkLogin() {
            try {
                const response = await fetch(
                    "/api/auth/current-user",
                    {
                        method: "GET",
                        credentials: "include"
                    }
                );

                if (!response.ok) {
                    window.location.href = "/login.html";
                    return false;
                }

                return true;

            } catch (error) {
                window.location.href = "/login.html";
                return false;
            }
        }

        async function loadMedia() {
            try {
                const response = await fetch(
                    "/api/media",
                    {
                        method: "GET",
                        credentials: "include"
                    }
                );

                if (!response.ok) {
                    document.getElementById("status").textContent =
                        "Could not load media. Please log in again.";
                    return;
                }

                allMedia = await response.json();

                displayMedia();

            } catch (error) {
                console.error("Load media error:", error);

                document.getElementById("status").textContent =
                    "Something went wrong while loading media.";
            }
        }

        function changeTab(tab, clickedButton) {
            currentTab = tab;

            document.querySelectorAll(".tab").forEach(button => {
                button.classList.remove("active");
            });

            clickedButton.classList.add("active");

            displayMedia();
        }
        
        function downloadMedia(fileUrl, fileName) {

    const link =
        document.createElement("a");

    link.href = fileUrl;
    link.download = fileName;

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);
}

        function displayMedia() {
            const gallery = document.getElementById("gallery");

            gallery.innerHTML = "";

            let filteredMedia = allMedia;

            if (currentTab === "saved") {
                filteredMedia = allMedia.filter(media => media.saved);
            } else if (currentTab !== "all") {
                filteredMedia = allMedia.filter(media =>
                    media.fileType &&
                    media.fileType.startsWith(currentTab + "/")
                );
            }

            if (filteredMedia.length === 0) {
                gallery.innerHTML = `
                    <div class="empty">
                        No media here yet 💗
                    </div>
                `;
                return;
            }

            filteredMedia.forEach(media => {
                const card = document.createElement("div");
                card.className = "media-card";

                let mediaElement = "";

                if (media.fileType.startsWith("image/")) {
                    mediaElement = `
                        <img
                            src="${media.fileUrl}"
                            alt="${escapeHtml(media.originalFileName)}"
                        >
                    `;
                } else if (media.fileType.startsWith("video/")) {
                    mediaElement = `
                        <video controls>
                            <source
                                src="${media.fileUrl}"
                                type="${media.fileType}"
                            >
                            Your browser does not support video.
                        </video>
                    `;
                } else if (media.fileType.startsWith("audio/")) {
                    mediaElement = `
                        <audio controls>
                            <source
                                src="${media.fileUrl}"
                                type="${media.fileType}"
                            >
                            Your browser does not support audio.
                        </audio>
                    `;
                }

                const savedText = media.saved
                    ? "Unsave 💾"
                    : "Save 💗";

                const savedClass = media.saved
                    ? "saved"
                    : "";

                card.innerHTML = `
                    ${mediaElement}

                    <div class="file-name">
                        ${escapeHtml(media.originalFileName)}
                    </div>

                    <div class="file-info">
                        Uploaded by ${escapeHtml(media.uploadedBy)}
                    </div>

                    <div class="card-actions">

    <button
        class="${savedClass}"
        onclick="toggleSaved(${media.id})"
    >
        ${savedText}
    </button>

    <button
        onclick="downloadMedia('${media.fileUrl}', '${escapeHtml(media.originalFileName)}')"
    >
        Download ⬇️
    </button>

    <button
        class="delete"
        onclick="deleteMedia(${media.id})"
    >
        Delete 🗑️
    </button>

</div>
                `;

                gallery.appendChild(card);
            });
        }

        async function uploadFile() {
            const fileInput =
                document.getElementById("fileInput");

            const uploadButton =
                document.getElementById("uploadButton");

            const status =
                document.getElementById("status");

            const file = fileInput.files[0];

            if (!file) {
                status.textContent =
                    "Please choose a picture, video or audio file first.";
                return;
            }

            const formData = new FormData();

            formData.append("file", file);

            uploadButton.disabled = true;
            uploadButton.textContent = "Uploading... 💗";
            status.textContent = "";

            try {
                const response = await fetch(
                    "/api/media/upload",
                    {
                        method: "POST",
                        credentials: "include",
                        body: formData
                    }
                );

                if (!response.ok) {
                    const errorText =
                        await response.text();

                    status.textContent =
                        errorText || "Upload failed.";
                    return;
                }

                const uploadedMedia =
                    await response.json();

                allMedia.unshift(uploadedMedia);

                fileInput.value = "";

                status.textContent =
                    "Uploaded successfully! 💖";

                displayMedia();

            } catch (error) {
                console.error("Upload error:", error);

                status.textContent =
                    "Upload failed. Please try again.";
            } finally {
                uploadButton.disabled = false;
                uploadButton.textContent =
                    "Upload Media 💖";
            }
        }

        async function toggleSaved(id) {
            try {
                const response = await fetch(
                    `/api/media/${id}/save`,
                    {
                        method: "PATCH",
                        credentials: "include"
                    }
                );

                if (!response.ok) {
                    alert("Could not update saved status.");
                    return;
                }

                const updatedMedia =
                    await response.json();

                allMedia = allMedia.map(media =>
                    media.id === updatedMedia.id
                        ? updatedMedia
                        : media
                );

                displayMedia();

            } catch (error) {
                console.error("Save error:", error);
                alert("Something went wrong.");
            }
        }

        async function deleteMedia(id) {
            const confirmed = confirm(
                "Delete this media permanently? 💔"
            );

            if (!confirmed) {
                return;
            }

            try {
                const response = await fetch(
                    `/api/media/${id}`,
                    {
                        method: "DELETE",
                        credentials: "include"
                    }
                );

                if (!response.ok) {
                    alert("Could not delete media.");
                    return;
                }

                allMedia =
                    allMedia.filter(media =>
                        media.id !== id
                    );

                displayMedia();

            } catch (error) {
                console.error("Delete error:", error);
                alert("Something went wrong.");
            }
        }

        async function logout() {
            try {
                await fetch(
                    "/api/auth/logout",
                    {
                        method: "POST",
                        credentials: "include"
                    }
                );

                window.location.href = "/login.html";

            } catch (error) {
                window.location.href = "/login.html";
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        async function startRecording() {

    const startButton =
        document.getElementById("startRecordingButton");

    const stopButton =
        document.getElementById("stopRecordingButton");

    const uploadButton =
        document.getElementById("uploadRecordingButton");

    const status =
        document.getElementById("recordingStatus");

    const preview =
        document.getElementById("recordingPreview");

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

        status.textContent =
            "Voice recording is not supported in this browser.";

        return;
    }

    try {

        recordingStream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });

        recordedChunks = [];
        recordedAudioBlob = null;

        mediaRecorder =
            new MediaRecorder(recordingStream);

        mediaRecorder.ondataavailable = function(event) {

            if (event.data.size > 0) {
                recordedChunks.push(event.data);
            }
        };

        mediaRecorder.onstop = function() {

            recordedAudioBlob =
                new Blob(
                    recordedChunks,
                    {
                        type: "audio/webm"
                    }
                );

            const audioUrl =
                URL.createObjectURL(
                    recordedAudioBlob
                );

            preview.src = audioUrl;
            preview.style.display = "block";

            uploadButton.disabled = false;

            status.textContent =
                "Recording ready! Listen before uploading 💗";
        };

        mediaRecorder.start();

        startButton.disabled = true;
        stopButton.disabled = false;
        uploadButton.disabled = true;

        preview.style.display = "none";

        status.textContent =
            "Recording... speak your heart ❤️";

    } catch (error) {

        console.error("Recording error:", error);

        status.textContent =
            "Microphone permission was denied or unavailable.";
    }
}

function stopRecording() {

    const startButton =
        document.getElementById("startRecordingButton");

    const stopButton =
        document.getElementById("stopRecordingButton");

    const status =
        document.getElementById("recordingStatus");

    if (
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
    ) {

        mediaRecorder.stop();

        if (recordingStream) {

            recordingStream
                .getTracks()
                .forEach(track => track.stop());

        }

        startButton.disabled = false;
        stopButton.disabled = true;

        status.textContent =
            "Preparing your voice note... 🎙️";
    }
}

async function uploadRecording() {

    const uploadButton =
        document.getElementById("uploadRecordingButton");

    const status =
        document.getElementById("recordingStatus");

    if (!recordedAudioBlob) {

        status.textContent =
            "Please record a voice note first.";

        return;
    }

    const formData =
        new FormData();

    formData.append(
        "file",
        recordedAudioBlob,
        "voice-note-" + Date.now() + ".webm"
    );

    uploadButton.disabled = true;
    uploadButton.textContent =
        "Uploading voice note... 💗";

    try {

        const response = await fetch(
            "/api/media/upload",
            {
                method: "POST",
                credentials: "include",
                body: formData
            }
        );

        if (!response.ok) {

            const errorText =
                await response.text();

            status.textContent =
                errorText || "Voice-note upload failed.";

            return;
        }

        const uploadedMedia =
            await response.json();

        allMedia.unshift(uploadedMedia);

        status.textContent =
            "Voice note uploaded successfully! 💖";

        document.getElementById(
            "recordingPreview"
        ).style.display = "none";

        recordedAudioBlob = null;
        recordedChunks = [];

        displayMedia();

    } catch (error) {

        console.error(
            "Voice-note upload error:",
            error
        );

        status.textContent =
            "Voice-note upload failed. Please try again.";

    } finally {

        uploadButton.disabled = true;
        uploadButton.textContent =
            "Upload Voice Note 💗";
    }
}

function toggleMenu() {
    const navLinks = document.getElementById("navLinks");

    if (navLinks) {
        navLinks.classList.toggle("open");
    }
}

        async function startPage() {
            const loggedIn = await checkLogin();

            if (loggedIn) {
                await loadMedia();
            }
        }

        startPage();
    </script>

</body>

</html>
